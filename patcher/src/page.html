<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag Hack Patcher</title>
<link rel="icon" href="data:,">
<meta name="description" content="Patches your own disc image in your browser. Nothing is uploaded.">
<style>
/*{{STYLE}}*/
</style>
</head>
<body>
<!-- This file is generated by patcher/make.py from patcher/src/. Edit the sources, not this file. -->
<header class="top">
  <div class="brand">
    <!-- the mark: two overlapping tiles, one handing over to the other (simple shapes, no game art) -->
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="9" width="22" height="22" rx="5" class="m1"/><rect x="15" y="9" width="22" height="22" rx="5" class="m2"/></svg>
    <div>
      <h1>Tag Hack Patcher</h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
  </div>
  <div class="toprow">
  <button id="lang" class="ghost langbtn" type="button" data-i18n="lang.button" data-i18n-title="lang.title"></button>
  <button id="theme" class="ghost" type="button" data-i18n-title="theme.title">
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg>
  </button>
  </div>
</header>

<main>
  <section class="col">
    <p class="lead" data-i18n="lead"></p>

    <!-- 1. the disc image -->
    <article class="card" id="card-disc">
      <h2><span class="n">1</span><span data-i18n="disc.h"></span></h2>
      <label class="drop" id="drop-disc" tabindex="0">
        <input type="file" id="in-disc" multiple accept=".bin,.cue,.img,application/octet-stream">
        <span class="drop-title" data-i18n="disc.drop"></span>
        <span class="drop-hint" data-i18n="disc.hint"></span>
      </label>
      <div class="status" id="st-disc" hidden></div>
    </article>

    <!-- 2. the optional arcade set -->
    <article class="card" id="card-arcade">
      <h2><span class="n">2</span><span data-i18n="arc.h"></span> <span class="opt" data-i18n="arc.opt"></span></h2>
      <p class="note" data-i18n="arc.note"></p>
      <label class="drop small" id="drop-arcade" tabindex="0">
        <input type="file" id="in-arcade" multiple accept=".zip,application/zip">
        <span class="drop-title" data-i18n="arc.drop"></span>
        <span class="drop-hint" id="arcade-hint"></span>
      </label>
      <div class="status" id="st-arcade" hidden></div>
    </article>

    <!-- 3. what will be built (always the release image: no options) -->
    <article class="card" id="card-build">
      <h2><span class="n">3</span><span data-i18n="build.h"></span></h2>
      <ul class="plan" id="plan"></ul>
      <div class="actions">
        <button id="go" class="primary" type="button" disabled></button>
        <button id="cancel" class="ghost" type="button" hidden data-i18n="build.cancel"></button>
        <span class="runtime" id="runtime"></span>
      </div>
      <div class="progress" id="progress" hidden>
        <div class="bar"><div class="fill" id="bar-fill"></div></div>
        <ol class="stages" id="stages"></ol>
      </div>
      <div class="status" id="st-build" hidden></div>
    </article>

    <!-- 4. the result -->
    <article class="card result" id="card-result" hidden>
      <h2><span class="n ok">✓</span><span data-i18n="result.h"></span></h2>
      <dl class="facts" id="facts"></dl>
      <div class="actions">
        <a class="primary button" id="dl-bin" data-i18n="dl.bin"></a>
        <a class="button" id="dl-cue" data-i18n="dl.cue"></a>
        <button class="button" id="dl-zip" type="button" data-i18n="dl.zip"></button>
      </div>
      <p class="note" data-i18n="result.note"></p>
      <p class="note" id="note-8mb" hidden data-i18n="result.note8"></p>
    </article>

    <details class="log"><summary data-i18n="log"></summary><pre id="log"></pre></details>
  </section>

  <aside class="col side">
    <article class="card flat" id="about"></article>
  </aside>
</main>

<footer>
  <p id="legal"></p>
  <p class="fine" id="fine"></p>
  <p class="fine" data-i18n="src.link"></p>
</footer>

<script type="application/json" id="cfg">{{CONFIG}}</script>
<script type="text/plain" id="worker-src">{{WORKER}}</script>
<script type="text/plain" id="bundle">{{BUNDLE}}</script>
<script type="application/json" id="zopfli">{{ZOPFLI}}</script>
<script>
/*{{APP}}*/
</script>
</body>
</html>
